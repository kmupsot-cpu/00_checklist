    let currentTab = 'knowledge';

    function renderChecklist(data, containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';

        data.categories.forEach(cat => {
            const block = document.createElement('div');
            block.className = 'category-block';

            const header = document.createElement('div');
            header.className = 'category-header';
            header.innerText = cat;
            block.appendChild(header);

            const itemList = document.createElement('div');
            itemList.className = 'item-list';

            const catItems = data.items.filter(item => item.category === cat);
            catItems.forEach(item => {
                const row = document.createElement('div');
                row.className = 'item-row';
                row.id = 'row-' + item.id;

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = item.id;
                checkbox.checked = localStorage.getItem(item.id) === 'true';

                if (checkbox.checked) {
                    row.classList.add('checked');
                }

                checkbox.addEventListener('change', (e) => {
                    localStorage.setItem(item.id, e.target.checked);
                    if (e.target.checked) {
                        row.classList.add('checked');
                    } else {
                        row.classList.remove('checked');
                    }
                    updateProgress();
                });

                const label = document.createElement('label');
                label.htmlFor = item.id;
                label.innerText = item.label;

                row.appendChild(checkbox);
                row.appendChild(label);
                itemList.appendChild(row);
            });

            block.appendChild(itemList);
            container.appendChild(block);
        });
    }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.checklist-section').forEach(sec => sec.classList.remove('active'));

        if (tab === 'knowledge') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('knowledge-section').classList.add('active');
            document.getElementById('tab-title-display').innerText = '100 個核心知識';
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('skills-section').classList.add('active');
            document.getElementById('tab-title-display').innerText = '100 個核心技能';
        }
        updateProgress();
    }

    function updateProgress() {
        const currentData = currentTab === 'knowledge' ? knowledgeData : skillsData;
        let checkedCount = 0;
        currentData.items.forEach(item => {
            if (localStorage.getItem(item.id) === 'true') {
                checkedCount++;
            }
        });
        const total = currentData.items.length;
        const percentage = Math.round((checkedCount / total) * 100);

        document.getElementById('progress-text').innerText = `${checkedCount} / ${total} (${percentage}%)`;
        document.getElementById('progress-bar').style.width = percentage + '%';
    }

    function resetCurrentTab() {
        if (confirm('確定要重置當前頁面的勾選進度嗎？')) {
            const currentData = currentTab === 'knowledge' ? knowledgeData : skillsData;
            currentData.items.forEach(item => {
                localStorage.removeItem(item.id);
                const cb = document.getElementById(item.id);
                if (cb) {
                    cb.checked = false;
                    document.getElementById('row-' + item.id).classList.remove('checked');
                }
            });
            updateProgress();
        }
    }

    // Initial render
    renderChecklist(knowledgeData, 'knowledge-section');
    renderChecklist(skillsData, 'skills-section');
    updateProgress();
</script>

</body>
</html>
